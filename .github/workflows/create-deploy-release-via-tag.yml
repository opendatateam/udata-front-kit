# Creates a tag on the deploy branch of `site` for `env`
# and calls the `build-push-image` workflow on that tag

name: Deployment of a given site on a given env
run-name: Trigger deploy ${{ inputs.site }}-${{ inputs.environment }}

on:
  workflow_dispatch:
    inputs:
      # workflow_dispatch `options:` can't reference vars (no expressions allowed here),
      # so this list must be kept in sync by hand with the vars.SITES repo variable
      # that build-push-image.yml's parse step reads.
      site:
        description: 'Site to deploy'
        required: true
        type: choice
        options:
          - accessibilite
          - culture
          - defis
          - ecospheres
          - hackathon
          - logistique
          - meteo-france
          - simplifions
      # Same restriction as above: kept in sync by hand with vars.ENVS.
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - demo
          - preprod
          - prod
      ref:
        description: 'Git ref (branch) to deploy (defaults to <site>-<environment>)'
        required: false
        type: string
      create_release:
        description: 'Create a GitHub release (prod only)'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  actions: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Determine ref
        id: ref
        run: |
          REF="${{ inputs.ref }}"
          if [[ -z "$REF" ]]; then
            REF="${{ inputs.site }}-${{ inputs.environment }}"
          fi
          echo "Computed ref: $REF"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - name: Compute next tag
        id: version
        shell: bash
        run: |
          SITE="${{ inputs.site }}"
          ENVIRONMENT="${{ inputs.environment }}"
          TODAY=$(date +%Y%m%d)
          PREFIX="${SITE}-${ENVIRONMENT}-${TODAY}"
          PATTERN="${PREFIX}-[0-9]+"

          EXISTING=$(git ls-remote --tags origin | grep -Eo "refs/tags/${PATTERN}$" | sed 's#refs/tags/##' || true)

          NEXT=1
          if [[ -n "$EXISTING" ]]; then
            MAX=$(echo "$EXISTING" | sed -E "s/^${PREFIX}-//" | sort -n | tail -1)
            NEXT=$((MAX + 1))
          fi

          TAG="${PREFIX}-${NEXT}"
          echo "Computed tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      # build-push-image.yml is workflow_dispatch-only, so pushing the tag above does
      # not start it: this dispatch is the only path to a build.
      - name: Dispatch build workflow
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # ref picks which build-push-image.yml definition runs, not the code it builds
          # (that comes from the tag): dispatch from main, or from your branch to test CI
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build-push-image.yml',
              ref: '${{ github.ref_name }}',
              inputs: {
                tag: '${{ steps.version.outputs.tag }}'
              }
            });

      # Last so a release failure cannot keep the build from being dispatched.
      - name: Create GitHub release
        if: inputs.environment == 'prod' && inputs.create_release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          SITE: ${{ inputs.site }}
        run: |
          # Checkout does not fetch tags, so read the previous release tag from the
          # remote. sort -V because N is not zero-padded (-10 would sort before -2).
          PREV=$(git ls-remote --tags origin \
            | grep -Eo "refs/tags/${SITE}-prod-[0-9]{8}-[0-9]+$" \
            | sed 's#refs/tags/##' \
            | grep -v "^${TAG}$" \
            | sort -V | tail -1 || true)

          OPTS=(--generate-notes --title "$TAG")
          if [[ -n "$PREV" ]]; then
            echo "Changelog since: $PREV"
            OPTS+=(--notes-start-tag "$PREV")
          fi

          gh release create "$TAG" "${OPTS[@]}"
