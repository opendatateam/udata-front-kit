# Use npm-like flat node_modules structure instead of pnpm's symlinks
# Required for Vite optimizeDeps and TypeScript to work correctly
nodeLinker: hoisted

# Cypress compatibility - disable pnpm's side effects cache
sideEffectsCache: false

# Don't fail on peer dependency warnings (common in Vue ecosystem)
strictPeerDependencies: false

# Security: Only install packages released at least 4 days ago (5760 minutes)
# Protects against supply-chain attacks by giving community time to detect malicious releases
minimumReleaseAge: 5760
minimumReleaseAgeExclude:
  - '@ecolabdata/*'
  - '@datagouv/components-next'

# Enforce pnpm usage - fail if npm or yarn is used
engineStrict: true

allowBuilds:
  '@scarf/scarf': false
  '@sentry/cli': false
  core-js: false
  cypress: true
  esbuild: false
  vue-demi: false

# Security: patch vulnerable transitive deps pinned by upstream (same major only)
overrides:
  'editorconfig>minimatch': ^9.0.9

# geopf's Panoramax control is unused: skip installing the viewer and its vulnerable maplibre-gl 5 (GHSA-jrc7-96c5-q579)
packageExtensions:
  geopf-extensions-openlayers@1.0.0-beta.15:
    peerDependenciesMeta:
      '@panoramax/web-viewer':
        optional: true

# Render GetCapabilities strings as text and only link http(s) URLs (ported from datagouv/cdata)
patchedDependencies:
  geopf-extensions-openlayers@1.0.0-beta.15: patches/geopf-extensions-openlayers@1.0.0-beta.15.patch
