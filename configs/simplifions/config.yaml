# config file for simplifions

# used as extras key
site_id: simplifions
# Error tracker : Sentry

sentry:
  domain_url: 'https://errors.data.gouv.fr/'
  dsn: 'https://c8268303ac0799edda45ced7faa7e0a0@errors.data.gouv.fr/38'
  environment: 'production'
  tracePropagationTargets: []
  tracesSampleRate: 1.0
  replaysSessionSampleRate: 0.1
  replaysOnErrorSampleRate: 1.0

datagouvfr:
  # data.gouv.fr base URL (use www subdomain on prod)
  base_url: https://www.data.gouv.fr
  # oauth settings
  oauth_client_id: 676452675336109a436f8f73
  tabular_api_url:

# universe configuration is now handled per page in pages.{page_id}.universe_query

# UI customizations
website:
  title: 'Simplifions.data.gouv.fr'
  seo:
    canonical_url: https://simplifions.data.gouv.fr
    meta:
      keywords: 'simplification, API, données, data, dites-le-nous une fois, proactivité, administration, collectivité, dlnuf'
      description: |
        Simplifiez les démarches et services des citoyens, entreprises et associations en récupérant pour eux leurs informations administratives grâce aux API et aux données de l'État.
      robots: 'index, follow'
    robots_txt:
      disallow:
        - /admin
    sitemap_xml:
      topics_pages:
        - solutions
        - cas-d-usages
      datasets_pages: []
      dataservices_pages: []
  rf_title: 'RÉPUBLIQUE<br>FRANÇAISE'
  # leave empty if not pertinent
  homepage:
    title:
    subtitle:
    sections:
    meta_description:
  footer:
    logo:
      src: '/static/logos/simplifions-logo.svg'
      width: '215px'
      height: '35px'
    phrase: 'Ce site est une déclinaison thématique de data.gouv.fr sur les données relatives à simplification administrative et à la circulation des données.'
    external_links:
      - label: 'data.gouv.fr'
        href: 'https://www.data.gouv.fr'
        title: 'data.gouv.fr - nouvelle fenêtre'
      - label: 'legifrance.gouv.fr'
        href: 'https://www.legifrance.gouv.fr/'
        title: 'legifrance - nouvelle fenêtre'
      - label: 'gouvernement.fr'
        href: 'https://www.gouvernement.fr'
        title: 'gouvernement.fr - nouvelle fenêtre'
    mandatory_links:
      - label: 'Plan du site'
        to: '/sitemap'
      - label: "Conditions générales d'utilisation"
        to: '/terms'
      - label: 'Politique de confidentialité'
        to: 'https://www.data.gouv.fr/fr/suivi/'
      - label: 'Accessibilité : partiellement conforme'
        to: '/accessibility'
  header:
    logo:
    title_image:
      src: '/static/logos/simplifions-logo.svg'
    admin_shortcut: false
    beta: true
    button:
      display: false # TODO : créer un formulaire de feedback sur tally.so
      label: 'Donnez votre avis'
      link: https://form.typeform.com/to/sYKAer7j
    search:
      display: false
  search_bar:
    display: false
  secondary_search:
    display: false
    name:
    link:
  notice:
    display: false
  menu:
    - text: Accueil
      to: /
    - text: Cas d'usages
      to: /cas-d-usages
    - text: Articles
      to: /articles
    - text: À propos
      to: /about
  router:
    static_pages:
      - title: 'À propos'
        id: 'about'
        route: '/about'
        url: '/static/simplifions/pages/about.md'
      - title: 'Guide pour la simplification'
        id: 'niveaux-simplification'
        route: '/niveaux-simplification'
        url: '/static/simplifions/pages/niveaux-simplification.md'
      - title: "Doctrine de référencement des cas d'usages"
        id: 'doctrine-referencement-cas-usages'
        route: '/doctrine-referencement-cas-usages'
        url: '/static/simplifions/pages/doctrine-referencement-cas-usages.md'
      - title: 'Doctrine de référencement des solutions'
        id: 'doctrine-referencement-solutions'
        route: '/doctrine-referencement-solutions'
        url: '/static/simplifions/pages/doctrine-referencement-solutions.md'
      - title: Simplifier le sourcing des marchés publics avec API Entreprise
        id: '/api-entreprise_cas-usage_marches_public_sourcing'
        route: '/api-entreprise_cas-usage_marches_public_sourcing'
        url: '/static/simplifions/pages/api-entreprise_cas-usage_marches_public_sourcing.md'
      - title: 'Accessibilité'
        id: 'accessibility'
        route: '/accessibility'
        url: '/static/simplifions/pages/accessibility.md'
      - title: "Conditions générales d'utilisation"
        id: 'terms'
        route: '/terms'
        url: '/static/simplifions/pages/terms.md'
      # Entrées articles : ces routes sont déjà servies par des composants custom (src/custom/simplifions/routes.ts),
      # elles ne sont déclarées ici que pour que udata-front-kit-seo les inclue dans sitemap.xml.
      - title: 'Articles'
        id: 'sitemap-articles'
        route: '/articles'
        url: ''
      - title: "Qu'est-ce qu'une API ?"
        id: 'sitemap-articles-qu-est-ce-qu-une-api'
        route: '/articles/qu-est-ce-qu-une-api'
        url: ''
      - title: 'Les API FranceConnectées'
        id: 'sitemap-articles-apis-franceconnectees'
        route: '/articles/apis-franceconnectees'
        url: ''
      - title: 'Guide de base pour les petites collectivités'
        id: 'sitemap-articles-guide-base-petites-collectivites'
        route: '/articles/guide-base-petites-collectivites'
        url: ''
      - title: "Prérequis et étapes d'intégration d'une API"
        id: 'sitemap-articles-prerequis-et-etapes-integration-api'
        route: '/articles/prerequis-et-etapes-integration-api'
        url: ''
      - title: "Vos interlocuteurs selon le type d'API"
        id: 'sitemap-articles-vos-interlocuteurs-selon-le-type-d-api'
        route: '/articles/vos-interlocuteurs-selon-le-type-d-api'
        url: ''
      - title: "Anticiper le parcours usager avant d'intégrer vos API"
        id: 'sitemap-articles-anticiper-le-parcours-usager-avant-d-integrer-vos-api'
        route: '/articles/anticiper-le-parcours-usager-avant-d-integrer-vos-api'
        url: ''
  show_quality_component: true
  oauth_option: true
  # debounce high enough for accessibility (screen readers will announce results)
  default_debounce_wait: 600
  pagination_sizes:
    topics_drafts_list: 9
    files_list: 6
  contact_email: contact@api.gouv.fr
  home_banner_colors:
    - '#f6f6f6'
    - '#e3e3fd'
    - '#BFDCB7'
  matomo:
    host: 'https://stats.data.gouv.fr'
    siteId: 311
  datasets:
    # TODO: better place for that?
    add_to_topic:
      enable: false
      page: cas-d-usages
    # similar to QUALITY_METADATA_BACKEND_IGNORE on data.gouv.fr
    harvest_backends_quality_warning:
    show_extended_information_panel: false
  # TODO: better place for that?
  topics:
    can_add_topics:
      everyone: false
      authorized_users:
  sitemap:
    - name: Accueil
      path: /
    - name: Cas d'usages
      path: /cas-d-usages
    - name: Articles
      path: /articles
    - name: Solutions
      path: /solutions
    - name: Jeux de données
      path: /datasets
    # Organizations page removed as not needed for simplifions
    - name: À propos
      path: /about
    - name: Conditions générales d'utilisation
      path: /terms
    - name: Accessibilité
      path: /accessibility

# organizations: (empty - no specific organizations configuration needed for simplifions)

# Shared filter values (using YAML anchors for reuse)
shared_filter_values:
  fournisseurs_de_service: &fournisseurs_de_service_values
    - id: communes # searches a tag = simplifions-fournisseurs-de-service-communes
      name: Communes et groupements de communes
    - id: departements
      name: Départements
    - id: regions
      name: Régions
    - id: tout-collectivites-territoires
      name: Toutes les collectivités et territoires
    - id: etat
      name: État
    # - id: autres-autorites-nationales
    #   name: Autres autorités nationales
    - id: organismes-droit-prive
      name: Organismes de droit privé
    - id: acteurs-education-enseignement
      name: Acteurs de l'éducation et de l'enseignement
    # - id: acteurs-culture
    #   name: Acteurs de la culture
    # - id: acteurs-sante
    #   name: Acteurs de la santé
    - id: acteurs-transport
      name: Acteurs du transport
    # - id: acteurs-environnement
    #   name: Acteurs de l'environnement
    - id: tout-acteurs-publics
      name: Tous les acteurs publics

  target_users: &target_users_values
    - id: particuliers
      name: Particuliers
    - id: entreprises
      name: Entreprises
    - id: associations
      name: Associations

  categorie_de_solution: &categorie_de_solution_values
    - id: brique-technique
      name: API, jeu de données ou brique logicielle
    - id: logiciel-metier
      name: Logiciel métier "clé en main"
    - id: portail-consultation
      name: Site de consultation

  types_de_simplification: &types_de_simplification_values
    - id: proactivite
      name: Proactivité
    - id: dlnuf
      name: Dites-le nous une fois
    - id: acces-facile
      name: Accès facile

pages:
  # CAS D'USAGES
  cas-d-usages:
    object_type: topics
    list_all: true
    universe_query:
      tag: simplifions-v2-cas-d-usages
    filter_prefix: simplifions-v2
    title: Cas d'usages
    breadcrumb_title:
    labels:
      singular: cas d'usage
      plural: cas d'usages
      extended: cas d'usage
    search:
      input: Filtrer les cas d'usages
      placeholder: null
    resources_tabs:
      discussions:
        display: true
        create: true
      datasets:
        display: false
      reuses:
        display: false
    editable: false
    filters: # ATTENTION : Ces filtres ont des ids qui correspondent à des valeurs dans Grist
      - name: 'Démarches gérées par :'
        id: fournisseurs-de-service
        type: select
        default_option: Tous les types d'acteurs
        use_filter_prefix: true
        applies_to_pages: [cas-d-usages, solutions]
        values: *fournisseurs_de_service_values
      - name: 'Démarches à destination des :'
        id: target-users
        type: select
        default_option: Tous les usagers
        use_filter_prefix: true
        applies_to_pages: [cas-d-usages, solutions]
        values: *target_users_values
      - name: 'Catégorie de solution :'
        id: categorie-de-solution
        type: select
        default_option: Toutes les catégories
        use_filter_prefix: true
        applies_to_pages: [cas-d-usages, solutions]
        values: *categorie_de_solution_values
      - name: 'Type de simplification des démarches :'
        id: types-de-simplification
        type: select
        default_option: Tous les types de simplification
        use_filter_prefix: true
        applies_to_pages: [cas-d-usages, solutions]
        values: *types_de_simplification_values

  # SOLUTIONS
  solutions:
    object_type: topics
    list_all: true
    universe_query:
      tag: simplifions-v2-solutions
    filter_prefix: simplifions-v2
    title: Solutions
    breadcrumb_title:
    labels:
      singular: solution
      plural: solutions
      extended: solution
      feminine: true
    search:
      input: Filtrer les solutions
      placeholder: null
    resources_tabs:
      discussions:
        display: true
        create: true
      datasets:
        display: false
      reuses:
        display: false
    editable: false
    filters: # ATTENTION : Ces filtres ont des ids qui correspondent à des valeurs dans Grist
      - name: 'Démarches gérées par :'
        id: fournisseurs-de-service
        type: select
        default_option: Tous les types d'acteurs
        use_filter_prefix: true
        applies_to_pages: [cas-d-usages, solutions]
        values: *fournisseurs_de_service_values
      - name: 'Démarches à destination des :'
        id: target-users
        type: select
        default_option: Tous les usagers
        use_filter_prefix: true
        applies_to_pages: [cas-d-usages, solutions]
        values: *target_users_values
      - name: 'Catégorie de solution :'
        id: categorie-de-solution
        type: select
        default_option: Toutes les catégories
        use_filter_prefix: true
        applies_to_pages: [cas-d-usages, solutions]
        values: *categorie_de_solution_values
      - name: 'Type de simplification des démarches :'
        id: types-de-simplification
        type: select
        default_option: Tous les types de simplification
        use_filter_prefix: true
        applies_to_pages: [cas-d-usages, solutions]
        values: *types_de_simplification_values
